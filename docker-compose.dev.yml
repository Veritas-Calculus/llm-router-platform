# Development overrides — NOT for production use.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# This file overrides the default config for LOCAL DEVELOPMENT:
#   - Builds images from source instead of pulling from GHCR
#   - Uses convenience passwords and debug settings
#   - Exposes DB/Redis ports to all interfaces for dev tools

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"

  server:
    image: llm-router-server:dev
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        VERSION: dev
        GIT_COMMIT: local
    environment:
      - DB_SSL_MODE=disable
      # REGISTRATION_MODE / COOKIE_SECURE_MODE / PROVIDER_SYNC_* / CAPTCHA_PROVIDER
      # live in DB-backed settings.Registry now. First boot defaults to
      # registration=open, captcha=dev. Tune via Admin → Settings.
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80
      - GIN_MODE=debug
      - LOG_LEVEL=debug

  web:
    image: llm-router-web:dev
    build:
      context: ./web
      dockerfile: Dockerfile
