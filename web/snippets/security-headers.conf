# Unified security headers — single source of truth for the web edge.
#
# nginx semantics: as soon as a child block declares ANY `add_header`, it
# drops the http/server-level headers it would otherwise inherit. Rather
# than copy-pasting the full list into every `location` block (the cause
# of audit finding H-01: drifted, conflicting CSP/HSTS/Cache-Control),
# this snippet declares each header exactly once and is `include`d from
# every location that needs them.
#
# Anything that depends on per-route behaviour (Cache-Control overrides
# for /index.html or static assets, for example) should be set in that
# location AFTER this include, since the same-name add_header from the
# child can replace the earlier one. We deliberately leave Cache-Control
# OUT of this snippet so locations remain free to set their own.

# Clickjacking — IE/legacy fallback. Modern browsers honour the CSP
# frame-ancestors directive instead.
add_header X-Frame-Options "DENY" always;

# Prevent MIME sniffing — defense-in-depth.
add_header X-Content-Type-Options "nosniff" always;

# Modern browsers ignore X-XSS-Protection; setting it to 0 explicitly
# disables the legacy auditor which has known bypass/regression issues.
add_header X-XSS-Protection "0" always;

# Limit referrer leakage.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content Security Policy.
#   default-src 'self'              everything must come from the SPA origin unless overridden
#   script-src 'self'               no inline JS, no 'unsafe-eval'
#   worker-src 'self' blob:         allow Web Workers from same-origin AND blob: URLs
#                                   (Sentry Replay compresses payloads via a blob: Worker;
#                                   without this directive browsers fall back to script-src
#                                   which forbids blob: — see audit finding H-02)
#   style-src 'self' 'unsafe-inline'  required by the current Tailwind build; do not relax further
#   img-src 'self' data: https:     SPA can show data: previews and remote https avatars
#   font-src 'self' https://fonts.gstatic.com   self-hosted + Google Fonts
#   connect-src 'self' http://localhost:9000 https://*.ingest.sentry.io  XHR/fetch/WebSocket targets
#                                   localhost:9000 = local self-hosted Sentry envelope target
#                                   *.ingest.sentry.io = SaaS Sentry, kept for the production
#                                   path; if Sentry is removed entirely you can drop this segment
#                                   and the matching tracePropagationTargets in web/src/main.tsx
#   frame-ancestors 'none'          no one can embed this app in an iframe
#   base-uri 'self'                 mitigate <base> injection
#   form-action 'self'              forms can only POST back to us
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:9000 https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# HSTS — single declaration with preload eligibility. Only emit on TLS-
# terminated deployments; the docker-compose dev edge is HTTP-only so the
# header is ignored by browsers anyway. We keep `preload` so production
# deployments behind real TLS can submit to hstspreload.org without
# rewriting headers downstream.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
