# Nginx main config — designed to run as non-root (uid 10001).
# Using standard /var paths mounted as tmpfs in docker-compose.

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    # Use standard cache paths (mounted as tmpfs in docker-compose)
    client_body_temp_path /var/cache/nginx;
    proxy_temp_path       /var/cache/nginx;
    fastcgi_temp_path     /var/cache/nginx;
    uwsgi_temp_path       /var/cache/nginx;
    scgi_temp_path        /var/cache/nginx;

    # X-Request-Id propagation — reuse client header or generate one
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" req_id=$req_id';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml
               application/javascript application/json;

    # Request body buffering — avoid temp file writes for typical LLM payloads
    client_body_buffer_size 512k;
    client_max_body_size 10m;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Use Docker embedded DNS so upstream IPs are re-resolved on each
        # request, preventing stale-IP 504s after container restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://server:8080;
        set $langfuse_backend http://langfuse-server:3000;

        # Security headers — single source of truth lives in
        # /etc/nginx/snippets/security-headers.conf and is `include`d from
        # every location below. nginx replaces (does NOT merge) the
        # inherited add_header set as soon as a child block declares any
        # add_header of its own — see the snippet's header comment.
        #
        # The server-level include here covers any path that ends up at
        # try_files without entering a location-specific block; child
        # locations re-include the snippet so they don't silently drop the
        # security headers. See audit finding H-01.
        include /etc/nginx/snippets/security-headers.conf;

        # index.html must never be cached so the browser picks up new JS/CSS hashes
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # SPA routing
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        # Operational endpoints must not return the SPA shell. /health is a
        # public liveness probe; /metrics is still protected by the backend's
        # JWT + admin middleware. The unauthenticated internal metrics endpoint
        # is Docker-network only and should not be exposed through the web edge.
        #
        # Health/readiness intentionally omit security-headers.conf — they
        # are upstream-controlled JSON probes; CSP/HSTS on a JSON liveness
        # endpoint is noise. nginx is the single source of Cache-Control
        # for these endpoints (Go middleware skips them by path), giving
        # exactly one no-store directive per response. See audit L-07.
        location = /health {
            add_header Cache-Control "no-store" always;
            proxy_pass $backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        location = /healthz {
            add_header Cache-Control "no-store" always;
            proxy_pass $backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # Prometheus metrics — defense-in-depth IP allowlist on top of the
        # backend's JWT+admin middleware. If a future operator accidentally
        # flips METRICS_ALLOW_UNAUTHENTICATED=true, nginx still rejects
        # non-private callers before the request reaches Go. See audit M-10.
        #
        # NOTE: when running behind an upstream LB (cloud provider, ingress),
        # nginx sees the LB IP, not the client. In that topology you need
        # `set_real_ip_from <lb_cidr>;` and `real_ip_header X-Forwarded-For;`
        # in the http {} block so the allow/deny rules below evaluate the
        # *original* caller. This compose stack runs nginx as the edge so
        # the docker network's private CIDRs cover real Prometheus scrapes.
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            allow ::1;
            deny all;

            proxy_pass $backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        location = /internal/metrics {
            return 404;
        }

        # API proxy (LLM endpoints + Stripe webhook).
        # Keep proxy_pass URI-less when using the $backend variable; otherwise
        # nginx replaces /v1/models with the literal URI in proxy_pass.
        #
        # Security headers are re-included so /api/* responses carry the
        # same CSP/HSTS/Frame-Options as the SPA shell. Cache-Control is
        # owned by the Go backend (no-store on non-health API responses)
        # so we don't redeclare it here — letting upstream win.
        location /api/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # GraphQL API proxy (management operations)
        location /graphql {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend/graphql;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # OAuth2 social login endpoints (providers, redirect, callback).
        # These are backend routes, not SPA routes. Keep URI-less proxy_pass so
        # /auth/oauth2/:provider/* reaches the matching Gin route unchanged.
        location /auth/oauth2/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Langfuse observability UI proxy (optional — only works when langfuse profile is active)
        # SECURITY: Gated by JWT auth subrequest to prevent unauthenticated access to LLM traces.
        # Langfuse contains all prompts and completions — treat as highly sensitive PII.
        location /langfuse/ {
            include /etc/nginx/snippets/security-headers.conf;
            # Auth subrequest: validates JWT via the backend's internal auth endpoint
            auth_request /auth/verify;
            auth_request_set $auth_status $upstream_status;

            proxy_pass $langfuse_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Internal auth verification endpoint — proxies the auth_request
        # subrequest to the backend's real JWT+admin gate at
        # /internal/auth-verify. The previous wiring pointed at /healthz
        # which always returned 200, so /langfuse/ was effectively
        # unprotected (audit I-03).
        #
        # `internal;` means clients can never call this directly — only
        # nginx subrequests reach it. We forward both Authorization (for
        # SDK clients) and Cookie (for browser sessions on the SPA) so the
        # backend's extractAccessToken helper sees the same shape as a
        # direct call.
        location = /auth/verify {
            internal;
            proxy_pass $backend/internal/auth-verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # LLM API proxy (OpenAI-compatible endpoints)
        # Proxy /v1/ directly to the server's native /v1/ routes
        location /v1/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # Root-level LLM API proxy (without /v1/ prefix)
        # Some OpenAI SDKs include /v1 in the base URL, so they call
        # /chat/completions directly instead of /v1/chat/completions.
        location /chat/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location /models {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
        }

        location /embeddings {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location /images/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location /audio/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # Runtime config — served from tmpfs because the container root
        # filesystem is read-only. The entrypoint writes the substituted
        # template to /tmp/runtime-config.js at startup; this alias picks
        # it up from there. Must NOT be cached because the contents change
        # across container restarts. See audit H-08 and
        # web/docker-entrypoint.sh.
        location = /runtime-config.js {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            default_type application/javascript;
            alias /tmp/runtime-config.js;
        }

        # Static assets caching.
        #
        # We deliberately do NOT use the `expires 1y;` directive here — it
        # auto-emits a second Cache-Control alongside our explicit
        # add_header, producing duplicate headers (same root cause as
        # audit finding L-07). One declaration, one source of truth.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
