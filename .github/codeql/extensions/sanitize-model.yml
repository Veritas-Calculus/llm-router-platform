extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      # Mark llm-router-platform/pkg/sanitize.{SafeString,SafeStringPtr,LogValue}
      # as barriers (sanitizers) on the log-injection (CWE-117) taint flow.
      # The helpers strip ASCII control characters and rebuild the string via
      # strings.Builder, so any newlines that could fake a new log entry are
      # removed before the value reaches a logging sink. CodeQL's default Go
      # taint tracker cannot see through the rune-by-rune rebuild, producing
      # a false positive (alert #152 on payment_handler.go:190).
      #
      # Format reference (mirrors github/codeql go/ql/lib/ext/*.model.yml):
      #   https://codeql.github.com/docs/codeql-language-guides/customizing-library-models-for-go/
      # Columns (barrierModel, 9):
      #   package, type, subtypes(bool), name, signature, ext, input, kind, provenance
      - ["llm-router-platform/pkg/sanitize", "", false, "SafeString", "", "", "ReturnValue", "log-injection", "manual"]
      - ["llm-router-platform/pkg/sanitize", "", false, "SafeStringPtr", "", "", "ReturnValue", "log-injection", "manual"]
      - ["llm-router-platform/pkg/sanitize", "", false, "LogValue", "", "", "ReturnValue", "log-injection", "manual"]
